name: Bug report
description: Report a reproducible problem with KarryCode.
body:
  - type: input
    id: environment
    attributes:
      label: KarryCode version and operating system
      placeholder: 0.1.0-beta.1, Windows 11 x64, PowerShell 7
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Steps, expected behavior and actual result
      description: Remove provider keys, private paths and profile data from logs.
    validations:
      required: true
