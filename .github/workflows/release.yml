name: Release KarryCode

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: karrycode-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            asset: karrycode-windows-x64.exe
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: karrycode-linux-gnu-x64.tar.gz
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset: karrycode-linux-x64.tar.gz
    env:
      TARGET: ${{ matrix.target }}
      ASSET: ${{ matrix.asset }}
    steps:
      - uses: actions/checkout@v6
      - name: Install the target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TARGET" == x86_64-unknown-linux-musl ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y musl-tools
            echo 'CC_x86_64_unknown_linux_musl=musl-gcc' >> "$GITHUB_ENV"
            echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
          fi
          rustup target add "$TARGET"
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Compile the release binary
        shell: bash
        run: cargo build --locked --release --target "$TARGET"
      - name: Verify the version and package the binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          dir="target/$TARGET/release"
          binary="$dir/karrycode"
          if [[ "$TARGET" == x86_64-pc-windows-msvc ]]; then
            binary="$binary.exe"
          fi
          version=$("./$binary" --version | tr -d '\r')
          test "$version" = "KarryCode CLI ${GITHUB_REF_NAME#v}"
          if [[ "$TARGET" == x86_64-pc-windows-msvc ]]; then
            cp "$binary" "release-assets/$ASSET"
          else
            sh -n install.sh
            tar -C "$dir" -czf "release-assets/$ASSET" karrycode
          fi
          cd release-assets
          digest=$(sha256sum --binary "$ASSET" | cut -d ' ' -f 1)
          printf '%s  %s\n' "$digest" "$ASSET" > "$ASSET.sha256"
      - name: Check the Windows installer contract
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tests/install.ps1 -Executable "./release-assets/$env:ASSET" `
            -Version ($env:GITHUB_REF_NAME.Substring(1))
      - uses: actions/upload-artifact@v6
        with:
          name: karrycode-${{ matrix.target }}
          path: release-assets/
          if-no-files-found: error

  arch:
    name: Smoke test on Arch Linux
    needs: build
    runs-on: ubuntu-24.04
    container: archlinux:base
    steps:
      - run: pacman -Syu --noconfirm --needed tar gzip
      - uses: actions/download-artifact@v7
        with:
          pattern: karrycode-x86_64-unknown-linux-*
          merge-multiple: true
      - name: Verify both Linux packages
        shell: bash
        run: |
          set -euo pipefail
          for archive in karrycode-linux-x64.tar.gz karrycode-linux-gnu-x64.tar.gz; do
            sha256sum --strict --check "$archive.sha256"
            tar -xzf "$archive" karrycode
            test "$(./karrycode --version)" = "KarryCode CLI ${GITHUB_REF_NAME#v}"
          done

  publish:
    needs: [build, arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: karrycode-*
          path: release-assets
          merge-multiple: true
      - name: Verify and publish assets
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          files=(
            karrycode-windows-x64.exe
            karrycode-linux-gnu-x64.tar.gz
            karrycode-linux-x64.tar.gz
          )
          sums=()
          for file in "${files[@]}"; do
            test -s "$file"
            sha256sum --strict --check "$file.sha256"
            sums+=("$file.sha256")
          done
          cat "${sums[@]}" > SHA256SUMS

          tag="$GITHUB_REF_NAME"
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" != true ]]; then
              echo 'This release is already public.'
              exit 0
            fi
            gh release upload "$tag" "${files[@]}" "${sums[@]}" SHA256SUMS --clobber
          else
            gh release create "$tag" --verify-tag --draft --generate-notes \
              --title "KarryCode ${tag#v}" "${files[@]}" "${sums[@]}" SHA256SUMS
          fi
          gh release edit "$tag" --draft=false --prerelease=false --latest
