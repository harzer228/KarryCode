name: Build KarryCode

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            artifact: windows-x64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Prepare Linux musl toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Check and package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist
          Copy-Item target/x86_64-pc-windows-msvc/release/karrycode.exe dist/karrycode-windows-x64.exe
          $version = ((./dist/karrycode-windows-x64.exe --version) -split ' ')[-1]
          Write-Output $version
          ./dist/karrycode-windows-x64.exe --help
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path install.ps1), [ref]$tokens, [ref]$errors)
          if ($errors) { throw ($errors | Out-String) }
          ./tests/install.ps1 -Executable ./dist/karrycode-windows-x64.exe -Version $version
      - name: Check and package Linux executable
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          target/x86_64-unknown-linux-musl/release/karrycode --version
          target/x86_64-unknown-linux-musl/release/karrycode --help
          sh -n install.sh
          tar -C target/x86_64-unknown-linux-musl/release -czf dist/karrycode-linux-x64.tar.gz karrycode
      - uses: actions/upload-artifact@v6
        with:
          name: karrycode-${{ matrix.artifact }}
          path: dist/karrycode-*
          if-no-files-found: error

  arch:
    runs-on: ubuntu-24.04
    needs: native
    container: archlinux:base
    steps:
      - run: pacman -Syu --noconfirm --needed gcc git rustup tar
      - uses: actions/checkout@v6
      - run: cargo test --locked
      - uses: actions/download-artifact@v7
        with:
          name: karrycode-linux-x64
      - run: |
          tar -xzf karrycode-linux-x64.tar.gz
          ./karrycode --version
          ./karrycode --help
